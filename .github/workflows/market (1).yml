          func build_rack(p: Vector3) -> void:
              solid_box(self, p + Vector3(0, 1.35, 0), Vector3(2.7, 2.7, 0.6), Color(0.2, 0.21, 0.23))
              var colors := [Color(0.8, 0.18, 0.1), Color(0.2, 0.55, 0.8), Color(0.8, 0.65, 0.1), Color(0.35, 0.7, 0.3)]
              for level in range(3):
                  mesh_box(self, p + Vector3(0, 0.35 + level * 0.65, 0.5), Vector3(2.75, 0.08, 0.5), Color(0.42, 0.43, 0.45))
                  for n in range(9):
                      mesh_box(self, p + Vector3(-1.15 + n * 0.29, 0.55 + level * 0.65, 0.55), Vector3(0.23, 0.32, 0.25), colors[(n + level) % 4])
              mesh_box(self, p + Vector3(0, 2.3, 0.5), Vector3(2.75, 0.08, 0.5), Color(0.55, 0.5, 0.3))
              var slots: Array = []
              for n in range(RACK_CAP):
                  var s := mesh_box(self, p + Vector3(-1.0 + n * 0.4, 2.52, 0.55), Vector3(0.28, 0.36, 0.28), colors[n % 4])
                  s.visible = n < 2
                  slots.append(s)
              racks.append({"pos": p, "count": 2, "slots": slots, "cols": colors})
              rack_exp.append(false)

          func refresh_rack(i: int) -> void:
              var r: Dictionary = racks[i]
              for n in range(RACK_CAP):
                  var s: MeshInstance3D = r.slots[n]
                  s.visible = n < r.count
                  var m: StandardMaterial3D = s.material_override
                  m.albedo_color = EXP_COL if rack_exp[i] else r.cols[n % 4]

          # ---------- actors ----------
          # Drop a rigged .glb into assets/models/ to replace the box figure.
          func build_figure(parent: Node3D, model: String, body: Color, skin: Color) -> void:
              var path := "res://assets/models/%s.glb" % model
              if ResourceLoader.exists(path):
                  var inst: Node = load(path).instantiate()
                  parent.add_child(inst)
                  return
              var mon := model == "monster"
              var legc := body if mon else Color(0.12, 0.13, 0.2)
              var hair := Color(0.16, 0.1, 0.06)
              var arm_x := 0.22 if mon else 0.28
              var alen := 0.95 if mon else 0.62
              # torso, hips, neck, head
              if mon:
                  mesh_cap(parent, Vector3(0, 1.1, 0), 0.13, 0.9, body, Vector3(1.0, 1.0, 0.8))
                  mesh_sph(parent, Vector3(0, 1.72, 0), 0.13, skin, Vector3(0.8, 1.5, 0.9))
              else:
                  mesh_cap(parent, Vector3(0, 1.1, 0), 0.19, 0.7, body, Vector3(1.3, 1.0, 0.8))
                  mesh_cap(parent, Vector3(0, 0.88, 0), 0.14, 0.3, legc, Vector3(1.3, 1.0, 0.85))
                  mesh_cap(parent, Vector3(0, 1.43, 0), 0.06, 0.16, skin)
                  mesh_sph(parent, Vector3(0, 1.62, 0), 0.15, skin, Vector3(0.92, 1.08, 1.0))
                  mesh_sph(parent, Vector3(0, 1.67, 0.03), 0.155, hair, Vector3(0.95, 1.0, 1.0))
                  for ex in [-0.055, 0.055]:
                      mesh_sph(parent, Vector3(ex, 1.63, -0.135), 0.02, Color(0.05, 0.05, 0.06))
                  mesh_sph(parent, Vector3(0, 1.58, -0.15), 0.025, skin.darkened(0.1))
              for side in [-1.0, 1.0]:
                  var sn := "L" if side < 0 else "R"
                  var leg := Node3D.new()
                  leg.name = "leg" + sn
                  leg.position = Vector3(0.11 * side, 0.85, 0)
                  parent.add_child(leg)
                  mesh_cap(leg, Vector3(0, -0.4, 0), 0.05 if mon else 0.075, 0.8, legc)
                  mesh_box(leg, Vector3(0, -0.8, -0.05), Vector3(0.13, 0.08, 0.26), Color(0.05, 0.05, 0.05))
                  var arm := Node3D.new()
                  arm.name = "arm" + sn
                  arm.position = Vector3(arm_x * side, 1.4, 0)
                  parent.add_child(arm)
                  mesh_cap(arm, Vector3(0, -alen / 2.0, 0), 0.035 if mon else 0.055, alen, legc if mon else body)
                  mesh_sph(arm, Vector3(0, -alen, 0), 0.045 if mon else 0.06, skin)

          # Procedural walk cycle, or "walk"/"idle" clips from an imported model.
          func animate(node: Node3D, moving: bool) -> void:
              var aps := node.find_children("*", "AnimationPlayer", true, false)
              if not aps.is_empty():
                  var ap: AnimationPlayer = aps[0]
                  var clip := "walk" if moving else "idle"
                  if ap.has_animation(clip) and ap.current_animation != clip:
                      ap.play(clip)
                  return
              var swing := sin(Time.get_ticks_msec() * 0.008) * 0.6 if moving else 0.0
              for entry in [["legL", 1.0], ["legR", -1.0], ["armL", -1.0], ["armR", 1.0]]:
                  var limb := node.get_node_or_null(NodePath(entry[0])) as Node3D
                  if limb:
                      limb.rotation.x = swing * entry[1]

