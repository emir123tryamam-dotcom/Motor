name: KAOS MARKET NIGHT SHIFT - Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/market.yml'
      - 'assets/**'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout (optional assets folder)
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK components
        run: |
          set -eux
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Download Godot and Android export templates
        run: |
          set -eux
          G=4.4.1
          wget -q --tries=5 --retry-connrefused --waitretry=3 "https://github.com/godotengine/godot/releases/download/${G}/Godot_v${G}-stable_linux.x86_64.zip" -O godot.zip
          wget -q --tries=5 --retry-connrefused --waitretry=3 "https://github.com/godotengine/godot/releases/download/${G}/Godot_v${G}-stable_export_templates.tpz" -O templates.tpz
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v${G}-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/${G}.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp -a templates-unpacked/templates/. "$HOME/.local/share/godot/export_templates/${G}.stable/"
          test -f "$HOME/.local/share/godot/export_templates/${G}.stable/android_debug.apk"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" || true
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Generate game project (single-file workflow)
        run: |
          set -eux
          mkdir -p game output
          if [ -d assets ]; then cp -r assets game/; fi
          cd game
          python3 - <<'PY'
          import zlib, struct
          W = 192
          rows = []
          for y in range(W):
              row = bytearray([0])
              for x in range(W):
                  dx, dy = x - 96, y - 96
                  d = (dx * dx + dy * dy) ** 0.5
                  up = 82 < x < 130 and y <= 96 and abs((96 - y) - (x - 82) * 0.8) < 6
                  lo = 82 < x < 130 and y >= 96 and abs((y - 96) - (x - 82) * 0.8) < 6
                  if 46 < d < 62:
                      c = (200, 30, 30)
                  elif (66 <= x <= 80 and 60 <= y <= 132) or up or lo:
                      c = (240, 240, 240)
                  else:
                      c = (12 + y // 12, 12, 22)
                  row += bytes(c)
              rows.append(bytes(row))
          raw = b''.join(rows)
          def ch(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          open('icon.png', 'wb').write(b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', W, W, 8, 2, 0, 0, 0)) + ch(b'IDAT', zlib.compress(raw)) + ch(b'IEND', b''))
          PY
          cat > project.godot <<'PROJ'
          config_version=5
          [application]
          config/name="KAOS MARKET: NIGHT SHIFT"
          run/main_scene="res://main.tscn"
          config/icon="res://icon.png"
          [audio]
          driver/enable_input=true
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720
          window/handheld/orientation=4
          window/stretch/mode="canvas_items"
          window/stretch/aspect="keep"
          [rendering]
          renderer/rendering_method="mobile"
          renderer/rendering_method.mobile="mobile"
          textures/vram_compression/import_etc2_astc=true
          environment/defaults/default_clear_color=Color(0.025,0.025,0.035,1)
          PROJ
          cat > export_presets.cfg <<'PRESETS'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../output/KAOS_MARKET_NIGHT_SHIFT.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          [preset.0.options]
          package/unique_name="com.kaosmarket.nightshift"
          package/name="KAOS MARKET NIGHT SHIFT"
          version/code=3
          version/name="0.3.0"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          permissions/internet=true
          permissions/access_wifi_state=true
          permissions/access_network_state=true
          permissions/record_audio=true
          launcher_icons/main_192x192="res://icon.png"
          [preset.1]
          name="Android AAB"
          platform="Android"
          runnable=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../output/KAOS_MARKET_NIGHT_SHIFT.aab"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          [preset.1.options]
          gradle_build/use_gradle_build=true
          gradle_build/export_format=1
          gradle_build/min_sdk="24"
          gradle_build/target_sdk="35"
          package/unique_name="com.kaosmarket.nightshift"
          package/name="KAOS MARKET NIGHT SHIFT"
          package/signed=true
          version/code=3
          version/name="0.3.0"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86=false
          architectures/x86_64=false
          permissions/internet=true
          permissions/access_wifi_state=true
          permissions/access_network_state=true
          permissions/record_audio=true
          launcher_icons/main_192x192="res://icon.png"
          PRESETS
          cat > main.tscn <<'SCENE'
          [gd_scene load_steps=2 format=3]
          [ext_resource type="Script" path="res://main.gd" id="1"]
          [node name="Game" type="Node3D"]
          script = ExtResource("1")
          SCENE
          cat > main.gd <<'SCRIPT'
          extends Node3D

          const WALK := 3.8
          const RUN := 5.8
          const PORT := 24565
          const ITEM_COUNT := 20
          const TRASH_COUNT := 4
          const RACK_CAP := 6
          const NIGHT_LEN := 300.0
          const SAVE := "user://kaos.cfg"
          const VRATE := 12000
          const SPAWN := Vector3(0, 0.1, 8)
          const CHECKOUT := Vector3(0, 0, -10.3)
          const FUSE := Vector3(-12.0, 0, 2.0)
          const DUMP := Vector3(-10, 0, 7.2)
          const HIDES := [Vector3(11.9, 0, 9.6), Vector3(0, 0, -11.9)]
          const SPILLS := [Vector3(-5.75, 0.02, -2.0), Vector3(0, 0.02, 1.5), Vector3(5.75, 0.02, -6.0), Vector3(-5.75, 0.02, 5.0), Vector3(8, 0.02, 0.5), Vector3(0, 0.02, -7.0)]
          const NAV_X := [-11.0, -8.0, -5.75, -3.5, 0.0, 3.5, 5.75, 8.0]
          const NAV_Z := [-8.0, -3.5, 1.5, 6.5]
          const CROSS_X := [-11.0, -5.75, 0.0, 5.75]
          const PRICES := {"speed": 60, "light": 45, "price": 90, "delivery": 40}
          const OUTFITS := [Color(0.1, 0.3, 0.6), Color(0.75, 0.12, 0.1), Color(0.15, 0.5, 0.2), Color(0.85, 0.7, 0.15)]
          const OUTFIT_NAMES := ["Mavi", "Kırmızı", "Yeşil", "Altın"]
          const EXP_COL := Color(0.45, 0.55, 0.15)
          const NOTES := [
              "Not 1: 'Önceki gece bekçisi sabah gelmedi. Geriye sadece fener ve bir kural listesi kaldı.'",
              "Not 2: 'Kameralar bazen boş koridorda birini gösteriyor. Sayma, bakma.'",
              "Not 3: 'Gölge ışıktan korkar. Sürüngen karanlıkta hızlanır.'",
              "Not 4: 'Fısıldayan sadece çok yakındayken görünür. Sesini dinle.'",
              "Not 5: 'Müşteri 03:00'te geliyorsa o bir müşteri değildir.'",
              "Not 6: 'Market on yıl önce kapanmıştı. Tabelayı kim yeniden yaktı?'",
              "Not 7: 'Sabah 06:00'da vardiya bitmez. Gece sadece bir an durur.'"]
          const ENDINGS := [
              "SON: SESSİZ SABAH - Hiçbir kuralı çiğnemeden sabaha çıktın. Market sana bir gece daha izin verdi.",
              "SON: DÖNGÜ - Kuralları çiğnedin. Kapı kilitlendi ve gece yeniden başladı.",
              "SON: GERÇEK - Notları birleştirdin: market seni bekçi olarak seçmişti. Artık kuralların bir parçasısın."]
          const ACH := {"first_sale": "İlk satış", "sales10": "10 satış", "night1": "İlk gece sağ çıktın", "night3": "3 gece sağ çıktın", "rule": "Kurala uydun", "fix": "Elektrikçi", "clean": "Temizlikçi (10 görev)", "revive": "Kurtarıcı", "hide": "Saklambaç", "ending": "Bir son gördün"}

          var player: CharacterBody3D
          var cam: Camera3D
          var flashlight: SpotLight3D
          var hud: CanvasLayer
          var hint: Label
          var objective: Label
          var dark: ColorRect
          var bat_bar: ProgressBar
          var sta_bar: ProgressBar
          var panels: Array = []
          var menu_panel: Panel
          var menu_title: Label
          var menu_play: Button
          var menu_outfit: Button
          var set_panel: Panel
          var gfx_btn: Button
          var ach_panel: Panel
          var ach_label: Label
          var help_panel: Panel
          var shop_panel: Panel
          var net_panel: Panel
          var net_info: Label
          var ip_edit: LineEdit
          var cctv_panel: Panel
          var cctv_title: Label
          var cctv_cams: Array = []
          var cctv_idx := 0
          var sum_panel: Panel
          var sum_label: Label
          var over_panel: Panel
          var over_label: Label
          var joy_base: ColorRect
          var action_buttons: Array[Button] = []
          var move_touch := -1
          var look_touch := -1
          var move_origin := Vector2.ZERO
          var touch_move := Vector2.ZERO
          var yaw := 0.0
          var pitch := 0.0
          var is_running := false
          var light_on := true
          var mode := "menu"
          var in_run := false
          var env_res: Environment

          # settings + save
          var cfg_vol := 0.8
          var cfg_sens := 0.004
          var cfg_gfx := 1
          var outfit := 0
          var unlocked: Array = [0]
          var ach: Dictionary = {}
          var notes_found: Array = []
          var endings: Array = []
          var broken := 0
          var total_sales := 0
          var tasks_done := 0

          # shared state (authoritative on host / solo)
          var money := 120.0
          var sales := 0
          var stocked := 0
          var night := 1
          var day_clock := 0.0
          var event_clock := 0.0
          var rand_timer := 20.0
          var power_timer := 80.0
          var phone_t := 0.0
          var trash_timer := 40.0
          var exp_timer := 40.0
          var fuse_taps := 0
          var power := true
          var note_shown := false
          var night_money0 := 0.0
          var night_sales0 := 0
          var upgrades := {"speed": 0, "light": 0, "price": 0}
          var items: Array[RigidBody3D] = []
          var item_state: Array[int] = []   # 0 world, -1 consumed, >0 carrier peer id
          var racks: Array = []
          var rack_exp: Array = []
          var spill_on: Array = []
          var spill_nodes: Array = []
          var customers: Array = []
          var stranger: Dictionary = {}
          var monster: Node3D
          var m_state := "hidden"
          var m_type := 0
          var m_path: Array = []
          var m_timer := 0.0
          var m_lit := 0.0
          var m_step_t := 0.0
          var m_target := Vector3.ZERO
          var peers := {}
          var avatars := {}
          var down_t := {}
          var tgt := {}

          # local player state
          var battery := 100.0
          var stamina := 100.0
          var hidden_in := -1
          var hide_prev := Vector3.ZERO

          var astar := AStar3D.new()
          var lamps: Array[OmniLight3D] = []
          var sounds := {}
          var streams := {}
          var heart_t := 0.0
          var step_timer := 0.0
          var net_timer := 0.0
          var rec_timer := 0.0
          var ext_ip := ""
          var record: Array = []
          var replaying := false
          var replay_fp := false
          var replay_index := 0.0
          var replay_root: Node3D
          var replay_cam: Camera3D

          # voice chat
          var talking := false
          var voice_ok := false
          var capture: AudioEffectCapture
          var mic_player: AudioStreamPlayer
          var voice_pb := {}
          var voice_nodes := {}

          func _ready() -> void:
              randomize()
              load_game()
              build_nav()
              build_world()
              build_player()
              build_items()
              for i in range(3):
                  build_customer(i)
              build_stranger()
              build_monster()
              build_audio()
              build_hud()
              multiplayer.peer_connected.connect(on_peer_connected)
              multiplayer.peer_disconnected.connect(on_peer_disconnected)
              multiplayer.connected_to_server.connect(func(): status("Sunucuya bağlandı"))
              multiplayer.connection_failed.connect(func(): go_offline("Bağlantı başarısız"))
              multiplayer.server_disconnected.connect(func(): go_offline("Sunucu kapandı"))
              apply_settings()
              open_menu()

          func _notification(what: int) -> void:
              if what == NOTIFICATION_APPLICATION_PAUSED or what == NOTIFICATION_WM_CLOSE_REQUEST:
                  save_game()

          # ---------- helpers ----------
          func online() -> bool:
              return multiplayer.multiplayer_peer is ENetMultiplayerPeer

          func is_host() -> bool:
              return not online() or multiplayer.is_server()

          func my_id() -> int:
              return multiplayer.get_unique_id() if online() else 1

          func clock_min() -> float:
              return day_clock * 420.0 / NIGHT_LEN

          func spawn_gap() -> float:
              return maxf(18.0, 45.0 - 5.0 * night)

          func mat(c: Color, rough: float = 0.8) -> StandardMaterial3D:
              var m := StandardMaterial3D.new()
              m.albedo_color = c
              m.roughness = rough
              if c.a < 1.0:
                  m.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
              return m

          func mesh_box(parent: Node, pos: Vector3, size: Vector3, color: Color) -> MeshInstance3D:
              var mi := MeshInstance3D.new()
              var bm := BoxMesh.new()
              bm.size = size
              mi.mesh = bm
              mi.material_override = mat(color)
              mi.position = pos
              parent.add_child(mi)
              return mi

          func solid_box(parent: Node, pos: Vector3, size: Vector3, color: Color) -> StaticBody3D:
              var body := StaticBody3D.new()
              body.position = pos
              parent.add_child(body)
              mesh_box(body, Vector3.ZERO, size, color)
              var cs := CollisionShape3D.new()
              var bs := BoxShape3D.new()
              bs.size = size
              cs.shape = bs
              body.add_child(cs)
              return body

          func mesh_cap(parent: Node, pos: Vector3, r: float, h: float, color: Color, stretch: Vector3 = Vector3.ONE) -> MeshInstance3D:
              var mi := MeshInstance3D.new()
              var cm := CapsuleMesh.new()
              cm.radius = r
              cm.height = maxf(h, r * 2.0)
              mi.mesh = cm
              mi.material_override = mat(color)
              mi.position = pos
              mi.scale = stretch
              parent.add_child(mi)
              return mi

          func mesh_sph(parent: Node, pos: Vector3, r: float, color: Color, stretch: Vector3 = Vector3.ONE) -> MeshInstance3D:
              var mi := MeshInstance3D.new()
              var sm := SphereMesh.new()
              sm.radius = r
              sm.height = r * 2.0
              mi.mesh = sm
              mi.material_override = mat(color)
              mi.position = pos
              mi.scale = stretch
              parent.add_child(mi)
              return mi

          func label3d(text: String, pos: Vector3) -> void:
              var l := Label3D.new()
              l.text = text
              l.position = pos
              l.pixel_size = 0.008
              l.billboard = BaseMaterial3D.BILLBOARD_ENABLED
              l.modulate = Color(1, 1, 1, 0.8)
              add_child(l)

          func status(s: String) -> void:
              hint.text = s

          func say_all(t: String) -> void:
              status(t)
              if online():
                  receive_status.rpc(t)

          # ---------- save / settings ----------
          func load_game() -> void:
              var c := ConfigFile.new()
              if c.load(SAVE) != OK:
                  return
              cfg_vol = float(c.get_value("s", "vol", 0.8))
              cfg_sens = float(c.get_value("s", "sens", 0.004))
              cfg_gfx = int(c.get_value("s", "gfx", 1))
              outfit = int(c.get_value("s", "outfit", 0))
              money = float(c.get_value("g", "money", 120.0))
              night = int(c.get_value("g", "night", 1))
              upgrades = c.get_value("g", "up", upgrades)
              ach = c.get_value("g", "ach", {})
              notes_found = c.get_value("g", "notes", [])
              endings = c.get_value("g", "endings", [])
              unlocked = c.get_value("g", "unlocked", [0])
              broken = int(c.get_value("g", "broken", 0))
              total_sales = int(c.get_value("g", "total_sales", 0))
              tasks_done = int(c.get_value("g", "tasks", 0))

          func save_game() -> void:
              var c := ConfigFile.new()
              c.load(SAVE)
              c.set_value("s", "vol", cfg_vol)
              c.set_value("s", "sens", cfg_sens)
              c.set_value("s", "gfx", cfg_gfx)
              c.set_value("s", "outfit", outfit)
              if is_host():
                  c.set_value("g", "money", money)
                  c.set_value("g", "night", night)
                  c.set_value("g", "up", upgrades)
                  c.set_value("g", "ach", ach)
                  c.set_value("g", "notes", notes_found)
                  c.set_value("g", "endings", endings)
                  c.set_value("g", "unlocked", unlocked)
                  c.set_value("g", "broken", broken)
                  c.set_value("g", "total_sales", total_sales)
                  c.set_value("g", "tasks", tasks_done)
              c.save(SAVE)

          func apply_settings() -> void:
              AudioServer.set_bus_volume_db(0, linear_to_db(maxf(cfg_vol, 0.001)))
              var vp := get_viewport()
              vp.scaling_3d_scale = [0.6, 0.8, 1.0][cfg_gfx]
              vp.msaa_3d = Viewport.MSAA_2X if cfg_gfx == 2 else Viewport.MSAA_DISABLED
              if flashlight:
                  flashlight.shadow_enabled = cfg_gfx == 2
              if gfx_btn:
                  gfx_btn.text = ["Grafik: DÜŞÜK", "Grafik: ORTA", "Grafik: YÜKSEK"][cfg_gfx]

          func give(id: String) -> void:
              if ach.has(id):
                  return
              ach[id] = true
              status("BAŞARIM: " + str(ACH[id]))
              save_game()

          func unlock(i: int) -> void:
              if not unlocked.has(i):
                  unlocked.append(i)

          # ---------- navigation ----------
          func build_nav() -> void:
              var id := 0
              var grid := {}
              for z in NAV_Z:
                  for x in NAV_X:
                      astar.add_point(id, Vector3(x, 0, z))
                      grid[Vector2(x, z)] = id
                      id += 1
              for zi in range(NAV_Z.size()):
                  for xi in range(NAV_X.size()):
                      var here: int = grid[Vector2(NAV_X[xi], NAV_Z[zi])]
                      if xi + 1 < NAV_X.size():
                          astar.connect_points(here, grid[Vector2(NAV_X[xi + 1], NAV_Z[zi])])
                      if zi + 1 < NAV_Z.size() and CROSS_X.has(NAV_X[xi]):
                          astar.connect_points(here, grid[Vector2(NAV_X[xi], NAV_Z[zi + 1])])

          func path_to(from: Vector3, to: Vector3) -> Array:
              var a := astar.get_closest_point(Vector3(from.x, 0, from.z))
              var b := astar.get_closest_point(Vector3(to.x, 0, to.z))
              var out: Array = Array(astar.get_point_path(a, b))
              out.append(Vector3(to.x, 0, to.z))
              return out

          func follow(node: Node3D, path: Array, speed: float, delta: float) -> bool:
              if path.is_empty():
                  return true
              var goal: Vector3 = path[0]
              var diff := goal - node.position
              diff.y = 0
              if diff.length() < 0.15:
                  path.pop_front()
                  return path.is_empty()
              node.position += diff.normalized() * min(speed * delta, diff.length())
              node.rotation.y = atan2(-diff.x, -diff.z)
              return false

          # ---------- world ----------
          func build_world() -> void:
              var dark_c := Color(0.09, 0.085, 0.09)
              solid_box(self, Vector3(0, -0.15, 0), Vector3(26, 0.3, 26), Color(0.17, 0.17, 0.19))
              solid_box(self, Vector3(0, 4, -13), Vector3(26, 8, 0.3), dark_c)
              solid_box(self, Vector3(0, 4, 13), Vector3(26, 8, 0.3), dark_c)
              solid_box(self, Vector3(-13, 4, 0), Vector3(0.3, 8, 26), dark_c)
              solid_box(self, Vector3(13, 4, 0), Vector3(0.3, 8, 26), dark_c)
              mesh_box(self, Vector3(0, 7.8, 0), Vector3(26, 0.2, 26), Color(0.14, 0.14, 0.16))
              for z in [-6.0, -1.0, 4.0]:
                  for x in [-8.0, -3.5, 3.5, 8.0]:
                      build_rack(Vector3(x, 0, z))
              solid_box(self, CHECKOUT + Vector3(0, 0.6, 0), Vector3(4, 1.2, 1.3), Color(0.22, 0.23, 0.24))
              mesh_box(self, CHECKOUT + Vector3(1.1, 1.4, -0.2), Vector3(0.5, 0.3, 0.2), Color(0.08, 0.4, 0.2))
              for i in range(3):
                  var p := Vector3(10.8, 0, -4.8 + i * 2.1)
                  solid_box(self, p + Vector3(0, 1.8, 0), Vector3(1.5, 3.6, 1.8), Color(0.13, 0.15, 0.17))
                  mesh_box(self, p + Vector3(-0.77, 1.8, 0), Vector3(0.04, 3.2, 1.6), Color(0.45, 0.65, 0.75, 0.35))
              solid_box(self, Vector3(-10, 1.1, 10), Vector3(4, 2.2, 3), Color(0.23, 0.18, 0.14))
              solid_box(self, Vector3(11.9, 1.2, 9.6), Vector3(1.0, 2.4, 1.6), Color(0.35, 0.24, 0.14))
