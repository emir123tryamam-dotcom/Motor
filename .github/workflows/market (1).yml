          # ---------- panels / menu flow ----------
          func close_panels() -> void:
              for p in panels:
                  p.visible = false

          func any_panel() -> bool:
              for p in panels:
                  if p.visible:
                      return true
              return false

          func open_panel(p: Panel) -> void:
              close_panels()
              p.visible = true

          func back() -> void:
              close_panels()
              if mode == "menu":
                  open_menu()

          func hud_panel(p: Panel) -> void:
              if mode != "play":
                  return
              var opening := not p.visible
              close_panels()
              p.visible = opening

          func toggle_shop() -> void:
              hud_panel(shop_panel)

          func toggle_net() -> void:
              hud_panel(net_panel)

          func toggle_cctv() -> void:
              hud_panel(cctv_panel)

          func open_menu() -> void:
              if mode == "sum" or mode == "over":
                  return
              close_panels()
              mode = "menu"
              menu_title.text = "KAOS MARKET\nGece %d   Para: $%d" % [night, int(money)]
              menu_play.text = "DEVAM" if in_run else "OYNA (Gece %d)" % night
              menu_outfit.text = "KIYAFET: " + str(OUTFIT_NAMES[outfit])
              menu_panel.visible = true

          func menu_btn() -> void:
              if mode == "play":
                  open_menu()
              elif mode == "menu" and in_run:
                  menu_start()

          func menu_start() -> void:
              close_panels()
              if not in_run:
                  in_run = true
                  if is_host():
                      start_night()
              mode = "play"

          func cycle_outfit() -> void:
              var i := unlocked.find(outfit)
              outfit = int(unlocked[(i + 1) % unlocked.size()])
              menu_outfit.text = "KIYAFET: " + str(OUTFIT_NAMES[outfit])
              save_game()

          func next_night() -> void:
              if is_host():
                  start_night()
              else:
                  status("Sunucu yeni geceyi başlatacak")

          func retry_night() -> void:
              next_night()

          func to_menu() -> void:
              in_run = false
              if online():
                  go_offline("Çevrimdışı")
              mode = "menu"
              open_menu()

          func update_objective() -> void:
              var minutes := int(23 * 60 + clock_min())
              var role := "TEK" if not online() else ("SUNUCU" if multiplayer.is_server() else "İSTEMCİ")
              var t := "GECE %d [%s]\nSaat: %02d:%02d\nPara: $%d  Satış: %d\nRafa dizilen: %d" % [night, role, (minutes / 60) % 24, minutes % 60, int(money), sales, stocked]
              if not power:
                  t += "\nELEKTRİK YOK!"
              if ext_ip != "" and online():
                  t += "\nIP: " + ext_ip
              objective.text = t
              bat_bar.value = battery
              sta_bar.value = stamina
              dark.visible = hidden_in >= 0 or is_down()
              dark.color = Color(0.4, 0, 0, 0.6) if is_down() else Color(0, 0, 0, 0.72)

          func toggle_run() -> void:
              if stamina < 15.0 and not is_running:
                  status("Nefes nefesesin")
                  return
              is_running = not is_running
              status("Koşma: Açık" if is_running else "Koşma: Kapalı")

          func toggle_lamp() -> void:
              if not light_on and battery < 5.0:
                  status("Fener pili boş, kapalıyken dolar")
                  return
              light_on = not light_on
              flashlight.visible = light_on

          # ---------- input ----------
          func over_ui(pos: Vector2) -> bool:
              if any_panel():
                  return true
              for b in action_buttons:
                  if b.get_global_rect().has_point(pos):
                      return true
              return false

          func _input(event: InputEvent) -> void:
              if event is InputEventScreenTouch:
                  if event.pressed:
                      if over_ui(event.position):
                          # extra fingers do not emulate a mouse, so press buttons by hand
                          if event.index > 0 and not any_panel():
                              for b in action_buttons:
                                  if b.get_global_rect().has_point(event.position):
                                      b.pressed.emit()
                          return
                      if event.position.x < 576.0 and move_touch == -1:
                          move_touch = event.index
                          move_origin = event.position
                          joy_base.position = move_origin - joy_base.size / 2.0
                      elif look_touch == -1:
                          look_touch = event.index
                  else:
                      if event.index == move_touch:
                          move_touch = -1
                          touch_move = Vector2.ZERO
                      if event.index == look_touch:
                          look_touch = -1
              elif event is InputEventScreenDrag:
                  if event.index == move_touch:
                      touch_move = (event.position - move_origin).limit_length(90.0) / 90.0
                  elif event.index == look_touch:
                      look(event.relative)
              elif event is InputEventMouseMotion and Input.is_mouse_button_pressed(MOUSE_BUTTON_RIGHT):
                  look(event.relative)

          func look(d: Vector2) -> void:
              yaw -= d.x * cfg_sens
              pitch = clamp(pitch - d.y * cfg_sens, -1.2, 1.2)
              player.rotation.y = yaw
              cam.rotation.x = pitch

          # ---------- main loop ----------
          func _process(delta: float) -> void:
              var k := minf(1.0, delta * 14.0)
              # heartbeat speeds up as the creature gets closer
              if mode == "play" and monster != null and player != null and sounds.has("heart"):
                  var hd := player.position.distance_to(monster.position)
                  if hd < 14.0:
                      heart_t -= delta
                      if heart_t <= 0.0:
                          sounds["heart"].play()
                          heart_t = remap(clampf(hd, 2.0, 14.0), 2.0, 14.0, 0.5, 1.2)
              for n in tgt.keys():
                  if not is_instance_valid(n):
                      tgt.erase(n)
                      continue
                  var t: Array = tgt[n]
                  n.position = n.position.lerp(t[0], k)
                  if t[1] != null:
                      n.rotation.y = lerp_angle(n.rotation.y, float(t[1]), k)

          func set_tgt(n: Node3D, p: Vector3, y: Variant = null) -> void:
              if not tgt.has(n) or n.position.distance_to(p) > 4.0:
                  n.position = p
                  if y != null:
                      n.rotation.y = float(y)
              tgt[n] = [p, y]

          func sim_stopped() -> bool:
              return mode == "sum" or mode == "over" or (not online() and mode != "play")

          func _physics_process(delta: float) -> void:
              if replaying:
                  play_replay(delta)
                  if not online():
                      return
              if not online() and mode != "play":
                  return
              move_player(delta)
              if is_host():
                  peers[my_id()] = my_pose()
                  simulate(delta)
              net_tick(delta)
              update_carried()
              record_tick(delta)
              update_objective()
              voice_tick()

          func my_pose() -> Dictionary:
              return {"pos": player.position, "yaw": yaw, "light": light_on, "outfit": outfit, "hid": hidden_in >= 0, "t": Time.get_ticks_msec() / 1000.0}

          func is_down() -> bool:
              if is_host():
                  return down_t.has(my_id())
              var me: Dictionary = peers.get(my_id(), {})
              return bool(me.get("down", false))

          func move_player(delta: float) -> void:
              var v := touch_move
              if Input.is_key_pressed(KEY_W): v.y -= 1
              if Input.is_key_pressed(KEY_S): v.y += 1
              if Input.is_key_pressed(KEY_A): v.x -= 1
              if Input.is_key_pressed(KEY_D): v.x += 1
              var down := is_down()
              if replaying or hidden_in >= 0 or down or mode != "play":
                  v = Vector2.ZERO
              var d := player.transform.basis * Vector3(v.x, 0, v.y)
              d = d.limit_length(1.0)
              var moving := d.length() > 0.2
              if is_running and (stamina <= 0.0 or not moving):
                  if stamina <= 0.0:
                      is_running = false
              if is_running and moving:
                  stamina = maxf(0.0, stamina - 22.0 * delta)
              else:
                  stamina = minf(100.0, stamina + 14.0 * delta)
              var sp: float = (RUN if is_running else WALK) * (1.0 + 0.15 * upgrades.speed)
              for i in range(spill_on.size()):
                  if spill_on[i] and player.position.distance_to(SPILLS[i]) < 1.0:
                      sp *= 0.6
              player.velocity.x = d.x * sp
              player.velocity.z = d.z * sp
              player.velocity.y = 0.0 if player.is_on_floor() else player.velocity.y - 18.0 * delta
              if hidden_in < 0:
                  player.move_and_slide()
              flashlight.light_energy = 3.5 + 2.5 * upgrades.light
              flashlight.spot_range = 17.0 + 7.0 * upgrades.light
              if light_on:
                  battery = maxf(0.0, battery - delta)
                  if battery <= 0.0:
                      light_on = false
                      flashlight.visible = false
                      status("Fener pili bitti")
              else:
                  battery = minf(100.0, battery + 2.5 * delta)
              var ty := 0.45 if down else (0.75 if hidden_in == 1 else 1.55)
              cam.position.y = lerpf(cam.position.y, ty, minf(1.0, delta * 8.0))
              step_timer -= delta
              if moving and step_timer <= 0:
                  sounds["step"].play()
                  step_timer = 0.34 if is_running else 0.52

          func update_carried() -> void:
              for i in range(items.size()):
                  var owner_id := item_state[i]
                  if owner_id <= 0 or not is_host():
                      continue
                  if peers.has(owner_id):
                      var p: Dictionary = peers[owner_id]
                      items[i].global_position = p.pos + Vector3(0, 1.15, 0) + Vector3(0, 0, -1.0).rotated(Vector3.UP, p.yaw)

          func simulate(delta: float) -> void:
              if sim_stopped():
                  return
              day_clock += delta
              event_clock += delta
              if day_clock >= NIGHT_LEN:
                  end_night()
                  return
              for i in range(items.size()):
                  if item_state[i] == 0 and items[i].position.y < -3:
                      items[i].position = random_floor()
              for c in customers:
                  update_customer(c, delta)
              update_stranger(delta)
              update_monster(delta)
              update_events(delta)
              for id in down_t.keys():
                  down_t[id] -= delta
                  if down_t[id] <= 0.0:
                      down_t.erase(id)
                      if peers.has(id):
                          peers[id]["pos"] = SPAWN
                          peers[id]["t"] = Time.get_ticks_msec() / 1000.0
                      if id == my_id():
                          respawn()
                      else:
                          respawn.rpc_id(id)

          # ---------- customer AI ----------
          func update_customer(c: Dictionary, delta: float) -> void:
              var n: Node3D = c.node
              if m_state != "hidden" and c.state != "flee" and n.position.distance_to(monster.position) < 4.0:
                  c.state = "flee"
                  c.has = false
                  c.path = path_to(n.position, Vector3(5.75, 0, 6.5))
              var speed := 3.2 if c.state == "flee" else 1.4
              var was: Vector3 = n.position
              var arrived := follow(n, c.path, speed, delta)
              animate(n, was.distance_to(n.position) > 0.001)
              if not arrived:
                  return
              c.timer -= delta
              if c.timer > 0:
                  return
              match c.state:
                  "choose":
                      c.rack = randi() % racks.size()
                      c.path = path_to(n.position, racks[c.rack].pos + Vector3(0, 0, 2.5))
                      c.state = "browse"
                      c.timer = randf_range(1.5, 4.0)
                  "browse":
                      if racks[c.rack].count > 0:
                          racks[c.rack].count -= 1
                          if rack_exp[c.rack]:
                              money = maxf(0.0, money - 10.0)
                              say_all("Müşteri bozuk ürün aldı! -$10")
                          refresh_rack(c.rack)
                          c.has = true
                          c.state = "pay"
                          c.path = path_to(n.position, Vector3(-1.2 + customers.find(c) * 1.2, 0, -8.8))
                          c.timer = 25.0
                      else:
                          c.state = "choose"
                          c.timer = 1.0
                  "pay":
                      c.has = false   # patience ran out
                      leave(c)
                  "leave", "flee":
                      c.state = "choose"
                      c.timer = randf_range(2.0, 6.0)

          func leave(c: Dictionary) -> void:
              c.state = "leave"
              c.timer = 0.0
              c.path = path_to(c.node.position, Vector3(0, 0, 6.5))

          # the 03:00 customer: selling to him breaks the rule
          func update_stranger(delta: float) -> void:
              var s: Dictionary = stranger
              var n: Node3D = s.node
              if s.state == "away":
                  if not s.done and clock_min() >= 240.0:
                      s.done = true
                      s.state = "come"
                      s.timer = 45.0
                      n.position = Vector3(0, 0, 6.5)
                      n.visible = true
                      s.path = path_to(n.position, Vector3(2.6, 0, -8.8))
                      emit_snd("door", Vector3(0, 1, 7.5))
                  return
              var was: Vector3 = n.position
              var arrived := follow(n, s.path, 1.2, delta)
              animate(n, was.distance_to(n.position) > 0.001)
              if s.state == "come" and arrived:
                  s.state = "wait"
              if s.state == "wait":
                  s.timer -= delta
                  if s.timer <= 0.0:
                      s.state = "leave"
                      s.path = path_to(n.position, Vector3(0, 0, 6.5))
                      money += 25.0
                      say_all("Garip müşteri sessizce çıktı. Kurala uydun +$25")
                      give("rule")
              elif s.state == "leave" and arrived:
                  s.state = "away"
                  n.visible = false

          func violate(id: int) -> void:
              broken += 1
              stranger.state = "leave"
              stranger.path = path_to(stranger.node.position, Vector3(0, 0, 6.5))
              money = maxf(0.0, money - 40.0)
              event_clock = 999.0
              fx("scare", Vector3.ZERO)
              if online():
                  fx.rpc("scare", Vector3.ZERO)
              say_all("KURALI ÇİĞNEDİN! -$40  Bir şey geliyor...")

          # ---------- creature AI (3 types) ----------
          func sees(from: Vector3, to: Vector3) -> bool:
              var q := PhysicsRayQueryParameters3D.create(from + Vector3(0, 1.5, 0), to + Vector3(0, 1.5, 0))
              q.exclude = [player.get_rid()]
              return get_world_3d().direct_space_state.intersect_ray(q).is_empty()

          func spawn_monster() -> void:
              var pool: Array = [0]
              if night >= 2:
                  pool.append(1)
              if night >= 3:
                  pool.append(2)
              m_type = int(pool.pick_random())
              monster.scale = Vector3(1.0, 0.55, 1.2) if m_type == 1 else Vector3.ONE
              monster.position = Vector3(-11, 0, -8)
              m_state = "patrol"
              m_path = []
              m_timer = 40.0
              m_step_t = 1.0
              monster.visible = m_type != 2
              fx("scare", Vector3.ZERO)
              if online():
                  fx.rpc("scare", Vector3.ZERO)
              say_all(["Işıklar titriyor... markette bir şey var!", "Yerde bir şey sürünüyor...", "Fısıltılar duyuyorsun..."][m_type])

          func update_monster(delta: float) -> void:
              if m_state == "hidden":
                  if event_clock > spawn_gap():
                      spawn_monster()
                  return
              m_timer -= delta
              var seen_id := 0
              var best := 11.0
              var lit := false
              var near_any := false
              var limit := 3.0 if m_type == 2 else 1.2
              for id in peers:
                  if down_t.has(id):
                      continue
                  var p: Dictionary = peers[id]
                  var dist: float = monster.position.distance_to(p.pos)
                  if dist < 3.0:
                      near_any = true
                  var hid: bool = p.get("hid", false)
                  if not (hid and dist > limit) and dist < best and sees(monster.position, p.pos):
                      best = dist
                      seen_id = id
                  var to_m: Vector3 = (monster.position - p.pos).normalized()
                  if p.light and dist < 9.0 and Vector3(0, 0, -1).rotated(Vector3.UP, p.yaw).dot(to_m) > 0.9 and sees(monster.position, p.pos):
                      lit = true
              m_lit = m_lit + delta if lit else maxf(0.0, m_lit - delta)
              var need: float = [2.0, 3.5, 1.5][m_type]
              if m_lit > need or m_timer <= 0:
                  hide_monster()
                  return
              if seen_id != 0:
                  m_state = "chase"
                  m_target = peers[seen_id].pos
                  m_path = path_to(monster.position, m_target) if best > 4.0 else [Vector3(m_target.x, 0, m_target.z)]
              elif m_path.is_empty():
                  m_state = "search" if m_state == "chase" else "patrol"
                  m_path = path_to(monster.position, astar.get_point_position(randi() % astar.get_point_count()))
              var speed: float = [3.0, 4.3, 2.4][m_type] if m_state == "chase" else [1.6, 2.3, 1.4][m_type]
              speed *= 1.0 + 0.1 * (night - 1)
              if not power:
                  speed *= 1.25
              if lit:
                  speed *= 0.35
              follow(monster, m_path, speed, delta)
              monster.visible = m_type != 2 or lit or near_any
              animate(monster, true)
              m_step_t -= delta
              if m_step_t <= 0.0:
                  m_step_t = [0.55, 0.35, 1.8][m_type]
                  emit_snd(["mstep", "scratch", "whisper"][m_type], monster.position)
              if seen_id != 0 and best < 1.2:
                  catch_player(seen_id)
                  return
              for c in customers:
                  if c.node.position.distance_to(monster.position) < 0.8:
                      fx("ragdoll", c.node.position)
                      if online():
                          fx.rpc("ragdoll", c.node.position)
                      c.node.position = Vector3(0, 0, 6.5)
                      c.path = []
                      c.state = "choose"
                      c.has = false
                      c.timer = 8.0

          func hide_monster() -> void:
              m_state = "hidden"
              monster.visible = false
              event_clock = 0.0
              m_lit = 0.0

          func catch_player(id: int) -> void:
              money = maxf(0.0, money - 20.0)
              var where: Vector3 = peers[id].pos
              fx("caught", where)
              if online():
                  fx.rpc("caught", where)
              for i in range(items.size()):
                  if item_state[i] == id:
                      set_item_state(i, 0)
              hide_monster()
              if not online():
                  game_over("Yaratık seni yakaladı.")
                  return
              down_t[id] = 30.0
              tell(id, "Yere düştün! Arkadaşın AL/BIRAK ile kaldırabilir.")
              for pid in peers:
                  if not down_t.has(pid):
                      return
              game_over("Herkes yere düştü.")

          @rpc("authority", "call_remote", "reliable")
          func respawn() -> void:
              player.position = SPAWN
              hidden_in = -1
              status("Ayağa kalktın")

          @rpc("authority", "call_remote", "reliable")
          func reset_local(msg: String) -> void:
              player.position = SPAWN
              hidden_in = -1
              battery = 100.0
              stamina = 100.0
              mode = "play"
              in_run = true
              sum_panel.visible = false
              over_panel.visible = false
              status(msg)

          @rpc("authority", "call_remote", "reliable")
          func rpc_sum(txt: String) -> void:
              show_sum(txt)

          @rpc("authority", "call_remote", "reliable")
          func rpc_over(txt: String) -> void:
              show_over(txt)

          @rpc("authority", "call_remote", "reliable")
          func fx(kind: String, where: Vector3) -> void:
              match kind:
                  "scare":
                      sounds["scare"].play()
                      play3d("growl", where)
                      if power:
                          var tw := create_tween()
                          for i in range(6):
                              for l in lamps:
                                  tw.parallel().tween_property(l, "light_energy", 0.05 if i % 2 == 0 else 0.9, 0.12)
                              tw.tween_interval(0.05)
                  "caught", "ragdoll":
                      sounds["scare"].play()
                      play3d("growl", where)
                      spawn_ragdoll(where)
                  "cash":
                      sounds["cash"].play()
                  "stock":
                      sounds["stock"].play()
                      stock_animation(where)
                  _:
                      if kind.begins_with("snd:"):
                          play3d(kind.substr(4), where)

          # ---------- night flow ----------
          func start_night() -> void:
              day_clock = 0.0
              event_clock = 0.0
              rand_timer = 20.0
              power_timer = randf_range(70.0, 120.0)
              phone_t = 0.0
              trash_timer = 40.0
              exp_timer = 40.0
              fuse_taps = 0
              note_shown = false
              hide_monster()
              set_power(true)
              spill_on.fill(false)
              for m in spill_nodes:
                  m.visible = false
              rack_exp.fill(false)
              for i in range(racks.size()):
                  racks[i].count = 2
                  refresh_rack(i)
              for i in range(items.size()):
                  items[i].position = random_floor()
                  items[i].linear_velocity = Vector3.ZERO
                  set_item_state(i, 0)
              for c in customers:
                  c.node.position = Vector3(0, 0, 6.5)
                  c.path = []
                  c.state = "choose"
                  c.has = false
                  c.timer = randf_range(1.0, 5.0)
              stranger.state = "away"
              stranger.done = false
              stranger.node.visible = false
              down_t.clear()
              night_money0 = money
              night_sales0 = sales
              close_panels()
              reset_local("Gece %d başladı. Rafları diz, müşterilere bak." % night)
              if online():
                  reset_local.rpc("Gece %d başladı" % night)

          func end_night() -> void:
              var earned := int(money - night_money0)
              var fined := 0
              for i in range(spill_on.size()):
                  if spill_on[i]:
                      fined += 5
              for e in rack_exp:
                  if e:
                      fined += 15
              money = maxf(0.0, money - fined)
              var txt := "VARDİYA BİTTİ - 06:00\nGece %d\nSatış: %d\nKazanç: $%d\nCezalar (leke / bozuk ürün): -$%d\nToplam para: $%d" % [night, sales - night_sales0, earned, fined, int(money)]
              if night - 1 < NOTES.size() and not notes_found.has(night - 1):
                  notes_found.append(night - 1)
                  txt += "\n\nYeni not bulundu:\n" + str(NOTES[night - 1])
              if night == 1:
                  unlock(1)
                  give("night1")
              if night == 3:
                  unlock(2)
                  give("night3")
              if night == 5:
                  var e_id := 0 if broken == 0 else (2 if notes_found.size() >= 5 else 1)
                  if not endings.has(e_id):
                      endings.append(e_id)
                  unlock(3)
                  txt += "\n\n" + str(ENDINGS[e_id])
                  give("ending")
              night += 1
              save_game()
              show_sum(txt)
              if online():
                  rpc_sum.rpc(txt)

          func show_sum(txt: String) -> void:
              close_panels()
              mode = "sum"
              sum_label.text = txt
              sum_panel.visible = true

          func show_over(txt: String) -> void:
              close_panels()
              mode = "over"
              over_label.text = txt
              over_panel.visible = true

          func game_over(reason: String) -> void:
              var loss := int(money * 0.25)
              money -= loss
              save_game()
              var txt := "GAME OVER\n%s\n\nPara cezası: -$%d\nKalan para: $%d\nGece %d yeniden denenecek." % [reason, loss, int(money), night]
              show_over(txt)
              if online():
                  rpc_over.rpc(txt)

          # ---------- random events, blackout, phone ----------
          func update_events(delta: float) -> void:
              rand_timer -= delta
              if rand_timer <= 0.0:
                  rand_timer = randf_range(22.0, 45.0)
                  random_event()
              power_timer -= delta
              if power and power_timer <= 0.0:
                  set_power(false)
                  fuse_taps = 0
                  power_timer = randf_range(80.0, 140.0) / (1.0 + 0.15 * night)
                  say_all("ELEKTRİK KESİLDİ! Sigorta kutusunu onar (sol duvar, GÖREV x4).")
                  event_clock = maxf(event_clock, spawn_gap() - 6.0)
              phone_t = maxf(0.0, phone_t - delta)
              exp_timer -= delta
              if exp_timer <= 0.0:
                  exp_timer = randf_range(35.0, 60.0)
                  var r := randi() % racks.size()
                  rack_exp[r] = true
                  refresh_rack(r)
              trash_timer -= delta
              if trash_timer <= 0.0:
                  trash_timer = 45.0
                  for i in range(ITEM_COUNT, items.size()):
                      if item_state[i] == -1:
                          items[i].position = random_floor()
                          set_item_state(i, 0)
                          break
              if not note_shown and clock_min() >= 210.0:
                  note_shown = true
                  say_all("NOT: 03:00'te gelene satış yapma.")

          func add_spill_near(p: Vector3) -> void:
              var best := -1
              var bd := 9999.0
              for i in range(SPILLS.size()):
                  if not spill_on[i]:
                      var d := p.distance_to(SPILLS[i])
                      if d < bd:
                          bd = d
                          best = i
              if best >= 0:
                  spill_on[best] = true
                  spill_nodes[best].visible = true

          func random_event() -> void:
              match randi() % 4:
                  0:
                      var r := randi() % racks.size()
                      racks[r].count = max(0, racks[r].count - 3)
                      refresh_rack(r)
                      var p: Vector3 = racks[r].pos
                      emit_snd("crash", p + Vector3(0, 1, 0))
                      add_spill_near(p)
                      say_all("Bir raf devrildi!")
                  1:
                      emit_snd("door", Vector3(randf_range(-10, 10), 1.0, randf_range(-8, 10)))
                      say_all("Bir kapı kendi kendine açıldı...")
                  2:
                      phone_t = 12.0
                      for k in range(3):
                          get_tree().create_timer(1.2 * k).timeout.connect(emit_snd.bind("phone", CHECKOUT + Vector3(0, 1.2, 0)))
                      say_all("Kasada telefon çalıyor...")
                  3:
                      add_spill_near(random_floor())
                      say_all("Yerde bir şey döküldü.")

          func unlock_note() -> void:
              var pool: Array = []
              for i in range(NOTES.size()):
                  if not notes_found.has(i):
                      pool.append(i)
              if pool.is_empty():
                  return
              var i: int = int(pool.pick_random())
              notes_found.append(i)
              say_all("Telefonda biri not bıraktı:\n" + str(NOTES[i]))
              save_game()

          # ---------- ragdoll ----------
          func rb_cap(root: Node3D, pos: Vector3, r: float, h: float, color: Color) -> RigidBody3D:
              var b := RigidBody3D.new()
              b.position = pos
              b.mass = 0.6
              b.linear_damp = 0.5
              b.angular_damp = 3.0
              b.can_sleep = true
              b.continuous_cd = true
              var pm := PhysicsMaterial.new()
              pm.friction = 0.9
              pm.bounce = 0.05
              b.physics_material_override = pm
              b.collision_layer = 2
              b.collision_mask = 1
              root.add_child(b)
              mesh_cap(b, Vector3.ZERO, r, h, color)
              var cs := CollisionShape3D.new()
              var cp := CapsuleShape3D.new()
              cp.radius = r
              cp.height = maxf(h, r * 2.0)
              cs.shape = cp
              b.add_child(cs)
              return b

          func rag_joint(root: Node3D, a: Node3D, b: Node3D, pos: Vector3, hinge: bool) -> void:
              var j: Joint3D
              if hinge:
                  j = HingeJoint3D.new()
                  j.rotation.y = PI / 2.0
                  j.set("angular_limit/enable", true)
                  j.set("angular_limit/lower", deg_to_rad(-125.0))
                  j.set("angular_limit/upper", deg_to_rad(8.0))
              else:
                  j = ConeTwistJoint3D.new()
                  j.set("swing_span", deg_to_rad(50.0))
                  j.set("twist_span", deg_to_rad(35.0))
              j.position = pos
              root.add_child(j)
              j.node_a = j.get_path_to(a)
              j.node_b = j.get_path_to(b)

          # skeletal ragdoll: capsule bones, cone-twist shoulders/hips/neck, hinge elbows/knees
          func spawn_ragdoll(where: Vector3) -> void:
              var root := Node3D.new()
              root.position = Vector3(where.x, 0, where.z)
              add_child(root)
              var cloth := Color(0.35, 0.3, 0.45)
              var skin := Color(0.65, 0.48, 0.4)
              var pants := Color(0.12, 0.13, 0.2)
              var torso := rb_cap(root, Vector3(0, 1.1, 0), 0.19, 0.7, cloth)
              var head := rb_cap(root, Vector3(0, 1.68, 0), 0.14, 0.3, skin)
              rag_joint(root, torso, head, Vector3(0, 1.5, 0), false)
              for side in [-1.0, 1.0]:
                  var ua := rb_cap(root, Vector3(0.34 * side, 1.2, 0), 0.06, 0.34, cloth)
                  var la := rb_cap(root, Vector3(0.34 * side, 0.88, 0), 0.05, 0.32, skin)
                  var th := rb_cap(root, Vector3(0.12 * side, 0.62, 0), 0.08, 0.42, pants)
                  var sh := rb_cap(root, Vector3(0.12 * side, 0.22, 0), 0.065, 0.42, pants)
                  rag_joint(root, torso, ua, Vector3(0.3 * side, 1.38, 0), false)
                  rag_joint(root, ua, la, Vector3(0.34 * side, 1.04, 0), true)
                  rag_joint(root, torso, th, Vector3(0.12 * side, 0.85, 0), false)
                  rag_joint(root, th, sh, Vector3(0.12 * side, 0.4, 0), true)
              var push := Vector3(randf_range(-2, 2), 1.5, randf_range(-2, 2))
              torso.apply_central_impulse(push)
              torso.apply_torque_impulse(Vector3(randf_range(-0.6, 0.6), randf_range(-0.4, 0.4), randf_range(-0.6, 0.6)))
              head.apply_central_impulse(push * 0.4)
              torso.contact_monitor = true
              torso.max_contacts_reported = 2
              var landed := [false]
              torso.body_entered.connect(func(_b):
                  if not landed[0]:
                      landed[0] = true
                      play3d("thud", torso.global_position))
              get_tree().create_timer(10.0).timeout.connect(root.queue_free)

          # ---------- actions (host validated) ----------
          func send_action(kind: String, arg: String = "") -> void:
              if replaying or mode != "play":
                  return
              if is_host():
                  peers[my_id()] = my_pose()
                  do_action(my_id(), kind, arg)
              else:
                  request_action.rpc_id(1, kind, arg)

          var last_act := {}

          @rpc("any_peer", "call_remote", "reliable")
          func request_action(kind: String, arg: String) -> void:
              if not multiplayer.is_server():
                  return
              var id := multiplayer.get_remote_sender_id()
              var now := Time.get_ticks_msec() / 1000.0
              if now - float(last_act.get(id, 0.0)) < 0.15:
                  return   # basic anti-spam
              last_act[id] = now
              do_action(id, kind, arg)

          func interact_action() -> void:
              send_action("interact")

          func stock_action() -> void:
              send_action("stock")

          func checkout_action() -> void:
              send_action("checkout")

          func task_action() -> void:
              send_action("task")

          func hide_action() -> void:
              if mode != "play" or is_down():
                  return
              if hidden_in >= 0:
                  hidden_in = -1
                  player.position = hide_prev
                  status("Saklanmaktan çıktın")
                  return
              for i in range(HIDES.size()):
                  if player.position.distance_to(HIDES[i]) < 3.2:
                      hidden_in = i
                      hide_prev = player.position
                      player.position = HIDES[i]
                      status("Saklandın. Çıkmak için tekrar SAKLAN.")
                      give("hide")
                      return
              status("Yakında saklanma yeri yok (dolap: sağ arka, kasa altı)")

          func tell(id: int, text: String) -> void:
              if id == my_id():
                  status(text)
              else:
                  receive_status.rpc_id(id, text)

          @rpc("authority", "call_remote", "reliable")
          func receive_status(text: String) -> void:
              status(text)

          func do_action(id: int, kind: String, arg: String) -> void:
              if not peers.has(id) or down_t.has(id):
                  return
              var pos: Vector3 = peers[id].pos
              var held := item_state.find(id)
              match kind:
                  "interact":
                      if held >= 0:
                          set_item_state(held, 0)
                          tell(id, "Bırakıldı")
                          return
                      for oid in down_t.keys():
                          if peers.has(oid) and pos.distance_to(peers[oid].pos) < 2.4:
                              down_t.erase(oid)
                              tell(oid, "Ayağa kaldırıldın!")
                              tell(id, "Arkadaşını kaldırdın!")
                              if id == my_id():
                                  give("revive")
                              return
                      var best := 2.5
                      var found := -1
                      for i in range(items.size()):
                          var d := pos.distance_to(items[i].position)
                          if item_state[i] == 0 and d < best:
                              best = d
                              found = i
                      if found >= 0:
                          set_item_state(found, id)
                          tell(id, "Çöp alındı. Konteynere götür." if found >= ITEM_COUNT else "Koli alındı. Rafa diz veya kasada sat.")
                      else:
                          tell(id, "Yakında koli yok")
                  "stock":
                      if held < 0:
                          tell(id, "Önce bir koli veya çöp al")
                          return
                      if held >= ITEM_COUNT:
                          if pos.distance_to(DUMP) < 3.2:
                              set_item_state(held, -1)
                              money += 6
                              tasks_done += 1
                              fx("cash", pos)
                              if online():
                                  fx.rpc("cash", pos)
                              tell(id, "Çöp atıldı +$6")
                              if tasks_done >= 10:
                                  give("clean")
                          else:
                              tell(id, "Çöpü konteynere götür (sol arka)")
                          return
                      for r in range(racks.size()):
                          if pos.distance_to(racks[r].pos + Vector3(0, 0, 1.3)) < 2.0 and racks[r].count < RACK_CAP:
                              var where: Vector3 = racks[r].slots[racks[r].count].position
                              racks[r].count += 1
                              set_item_state(held, -1)
                              stocked += 1
                              money += 5
                              fx("stock", where)
                              if online():
                                  fx.rpc("stock", where)
                              get_tree().create_timer(1.3).timeout.connect(refresh_rack.bind(r))
                              return
                      tell(id, "Dolu olmayan bir rafın önüne geç")
                  "checkout":
                      if pos.distance_to(CHECKOUT) > 4.5:
                          tell(id, "Kasaya yaklaşmalısın")
                          return
                      var gain: float = 12.0 + 4.0 * upgrades.price
                      var done := false
                      for c in customers:
                          if c.state == "pay" and c.has and c.path.is_empty():
                              c.has = false
                              leave(c)
                              done = true
                              break
                      if not done and stranger.state == "wait":
                          violate(id)
                          return
                      if not done and held >= ITEM_COUNT:
                          tell(id, "Çöp satılmaz")
                          return
                      if not done and held >= 0:
                          set_item_state(held, -1)
                          done = true
                      if done:
                          money += gain
                          sales += 1
                          total_sales += 1
                          fx("cash", pos)
                          if online():
                              fx.rpc("cash", pos)
                          tell(id, "Satış: +$%d" % int(gain))
                          give("first_sale")
                          if total_sales >= 10:
                              give("sales10")
                      else:
                          tell(id, "Bekleyen müşteri veya elinde koli yok")
                  "task":
                      for i in range(SPILLS.size()):
                          if spill_on[i] and pos.distance_to(SPILLS[i]) < 2.0:
                              spill_on[i] = false
                              spill_nodes[i].visible = false
                              money += 8
                              tasks_done += 1
                              fx("cash", pos)
                              if online():
                                  fx.rpc("cash", pos)
                              tell(id, "Zemin silindi +$8")
                              if tasks_done >= 10:
                                  give("clean")
                              return
                      if not power and pos.distance_to(FUSE) < 2.8:
                          fuse_taps += 1
                          if fuse_taps >= 4:
                              set_power(true)
                              money += 15
                              say_all("Elektrik geri geldi! +$15")
                              give("fix")
                          else:
                              tell(id, "Sigorta onarılıyor %d/4" % fuse_taps)
                          return
                      if phone_t > 0.0 and pos.distance_to(CHECKOUT) < 4.0:
                          phone_t = 0.0
                          event_clock = maxf(event_clock, spawn_gap() - 10.0)
                          if randf() < 0.6:
                              unlock_note()
                          else:
                              say_all("Ahizeden sadece nefes sesi geliyor...")
                          return
                      for r in range(racks.size()):
                          if pos.distance_to(racks[r].pos + Vector3(0, 0, 1.3)) < 2.0:
                              if rack_exp[r]:
                                  rack_exp[r] = false
                                  racks[r].count = max(0, racks[r].count - 1)
                                  refresh_rack(r)
                                  money += 10
                                  tasks_done += 1
                                  tell(id, "Son kullanma tarihi geçmiş ürün atıldı +$10")
                                  if tasks_done >= 10:
                                      give("clean")
                              else:
                                  tell(id, "Bu raftaki tarihler geçerli")
                              return
                      tell(id, "Yakında görev yok")
                  "buy":
                      if not PRICES.has(arg):
                          return
                      if upgrades.has(arg) and upgrades[arg] >= 2:
                          tell(id, "En üst seviye")
                      elif money < PRICES[arg]:
                          tell(id, "Yeterli para yok")
                      else:
                          money -= PRICES[arg]
                          if upgrades.has(arg):
                              upgrades[arg] += 1
                          else:
                              for i in range(ITEM_COUNT):
                                  if item_state[i] == -1:
                                      items[i].position = random_floor()
                                      items[i].linear_velocity = Vector3.ZERO
                                      set_item_state(i, 0)
                          tell(id, "Satın alındı")
                          save_game()

          # ---------- stocking animation: carton opens, product flies to shelf ----------
          func stock_animation(target: Vector3) -> void:
              var root := Node3D.new()
              root.position = target + Vector3(0, -0.6, 0.7)
              add_child(root)
              mesh_box(root, Vector3.ZERO, Vector3(0.42, 0.3, 0.42), Color(0.6, 0.42, 0.22))
              var tw := create_tween()
              for side in [-1.0, 1.0]:
                  var hinge := Node3D.new()
                  hinge.position = Vector3(0.21 * side, 0.16, 0)
                  root.add_child(hinge)
                  mesh_box(hinge, Vector3(-0.105 * side, 0, 0), Vector3(0.21, 0.02, 0.42), Color(0.7, 0.52, 0.3))
                  tw.parallel().tween_property(hinge, "rotation:z", -2.2 * side, 0.4)
              var product := mesh_box(root, Vector3.ZERO, Vector3(0.26, 0.34, 0.26), Color(0.85, 0.65, 0.15))
              tw.tween_property(product, "position", Vector3(0, 0.9, 0), 0.4)
              tw.tween_property(product, "position", target - root.position, 0.4)
              tw.tween_callback(root.queue_free)

          # ---------- multiplayer (ENet, host authoritative, LAN or internet) ----------
          func host_game() -> void:
              go_offline("")
              var peer := ENetMultiplayerPeer.new()
              if peer.create_server(PORT, 3) != OK:
                  status("Sunucu kurulamadı")
                  return
              multiplayer.multiplayer_peer = peer
              peers.clear()
              for i in range(items.size()):
                  if item_state[i] > 0:
                      set_item_state(i, 0)
              var fresh := not in_run
              in_run = true
              close_panels()
              if fresh:
                  start_night()
              mode = "play"
              ext_ip = ""
              var up := UPNP.new()
              if up.discover(1500) == UPNP.UPNP_RESULT_SUCCESS:
                  var gw := up.get_gateway()
                  if gw and gw.is_valid_gateway():
                      up.add_port_mapping(PORT, PORT, "KaosMarket", "UDP", 3600)
                      ext_ip = up.query_external_address()
              if ext_ip != "":
                  status("Sunucu açık. İnternet IP: %s  Port: %d (UDP)" % [ext_ip, PORT])
              else:
                  status("Sunucu açık (UPnP yok). İnternet için router'da UDP %d aç. Wi-Fi'da IP yeterli." % PORT)

          func join_game() -> void:
              var address := ip_edit.text.strip_edges()
              if address.length() < 4:
                  status("IP veya alan adı gir")
                  return
              go_offline("")
              var peer := ENetMultiplayerPeer.new()
              if peer.create_client(address, PORT) != OK:
                  status("Bağlanılamadı")
                  return
              multiplayer.multiplayer_peer = peer
              in_run = true
              mode = "play"
              close_panels()
              for i in range(items.size()):
                  items[i].freeze = true
              status("Bağlanıyor...")

          func go_offline(message: String) -> void:
              if online():
                  multiplayer.multiplayer_peer.close()
              multiplayer.multiplayer_peer = OfflineMultiplayerPeer.new()
              peers.clear()
              down_t.clear()
              tgt.clear()
              ext_ip = ""
              talking = false
              action_buttons[8].text = "KONUŞ"
              for id in avatars:
                  avatars[id].queue_free()
              avatars.clear()
              for id in voice_nodes:
                  voice_nodes[id].queue_free()
              voice_nodes.clear()
              voice_pb.clear()
              for i in range(items.size()):
                  set_item_state(i, 0 if item_state[i] > 0 else item_state[i])
              status(message)

          func on_peer_connected(id: int) -> void:
              status("Oyuncu bağlandı: %d" % id)

          func on_peer_disconnected(id: int) -> void:
              peers.erase(id)
              down_t.erase(id)
              last_act.erase(id)
              if is_host():
                  for i in range(items.size()):
                      if item_state[i] == id:
                          set_item_state(i, 0)
              if avatars.has(id):
                  avatars[id].queue_free()
                  avatars.erase(id)

          func net_tick(delta: float) -> void:
              if not online() or multiplayer.multiplayer_peer.get_connection_status() != MultiplayerPeer.CONNECTION_CONNECTED:
                  return
              net_timer -= delta
              if net_timer > 0:
                  return
              net_timer = 0.066
              if multiplayer.is_server():
                  receive_snapshot.rpc(snapshot())
                  update_avatars()
              else:
                  send_pose.rpc_id(1, player.position, yaw, light_on, outfit, hidden_in >= 0)

          # host-side validation: area clamp, teleport / speed-hack rejection
          @rpc("any_peer", "call_remote", "unreliable_ordered")
          func send_pose(pos: Vector3, rot: float, lamp_on: bool, oc: int, hid: bool) -> void:
              if not multiplayer.is_server():
                  return
              var id := multiplayer.get_remote_sender_id()
              var now := Time.get_ticks_msec() / 1000.0
              var old: Dictionary = peers.get(id, {})
              pos.x = clampf(pos.x, -12.6, 12.6)
              pos.z = clampf(pos.z, -12.6, 12.6)
              pos.y = clampf(pos.y, -0.5, 2.0)
              if not old.is_empty():
                  var dt: float = maxf(now - float(old.get("t", now)), 0.016)
                  if old.pos.distance_to(pos) > 9.0 * dt + 1.5 or down_t.has(id):
                      return
              peers[id] = {"pos": pos, "yaw": rot, "light": lamp_on, "outfit": clampi(oc, 0, 3), "hid": hid, "t": now}

          func snapshot() -> Dictionary:
              var it: Array = []
              for i in range(items.size()):
                  it.append([items[i].position, items[i].rotation, item_state[i]])
              var cu: Array = []
              for c in customers:
                  cu.append([c.node.position, c.node.rotation.y])
              var ra: Array = []
              for r in racks:
                  ra.append(r.count)
              var pl := {}
              for id in peers:
                  var d: Dictionary = peers[id].duplicate()
                  d["down"] = down_t.has(id)
                  pl[id] = d
              var sn: Node3D = stranger.node
              return {"players": pl, "items": it, "customers": cu, "racks": ra, "rexp": rack_exp, "spills": spill_on, "power": power,
                  "st": [sn.position, sn.rotation.y, sn.visible],
                  "monster": [monster.position, monster.rotation.y, monster.visible, m_type],
                  "money": money, "sales": sales, "stocked": stocked, "clock": day_clock, "night": night, "up": upgrades.duplicate()}

          @rpc("authority", "call_remote", "unreliable_ordered")
          func receive_snapshot(s: Dictionary) -> void:
              peers = s.players
              for i in range(items.size()):
                  var d: Array = s.items[i]
                  set_item_state(i, d[2])
                  set_tgt(items[i], d[0])
                  items[i].rotation = d[1]
              for i in range(customers.size()):
                  var n: Node3D = customers[i].node
                  var p: Vector3 = s.customers[i][0]
                  animate(n, n.position.distance_to(p) > 0.05)
                  set_tgt(n, p, s.customers[i][1])
              var sn: Node3D = stranger.node
              animate(sn, sn.position.distance_to(s.st[0]) > 0.05)
              set_tgt(sn, s.st[0], s.st[1])
              sn.visible = s.st[2]
              for i in range(racks.size()):
                  if racks[i].count != s.racks[i] or rack_exp[i] != s.rexp[i]:
                      racks[i].count = s.racks[i]
                      rack_exp[i] = s.rexp[i]
                      refresh_rack(i)
              for i in range(spill_on.size()):
                  spill_on[i] = s.spills[i]
                  spill_nodes[i].visible = s.spills[i]
              if s.power != power:
                  set_power(s.power)
              m_type = s.monster[3]
              monster.scale = Vector3(1.0, 0.55, 1.2) if m_type == 1 else Vector3.ONE
              set_tgt(monster, s.monster[0], s.monster[1])
              monster.visible = s.monster[2]
              animate(monster, monster.visible)
              money = s.money
              sales = s.sales
              stocked = s.stocked
              day_clock = s.clock
              night = s.night
              upgrades = s.up
              update_avatars()

          func update_avatars() -> void:
              for id in peers:
                  if id == my_id():
                      continue
                  var pd: Dictionary = peers[id]
                  if not avatars.has(id):
                      var n := Node3D.new()
                      add_child(n)
                      build_figure(n, "player", OUTFITS[clampi(int(pd.get("outfit", 0)), 0, 3)], Color(0.65, 0.48, 0.4))
                      var spot := SpotLight3D.new()
                      spot.name = "Lamp"
                      spot.position = Vector3(0, 1.5, -0.3)
                      spot.light_energy = 3.0
                      spot.spot_range = 15
                      n.add_child(spot)
                      avatars[id] = n
                  var a: Node3D = avatars[id]
                  var target: Vector3 = pd.pos
                  animate(a, a.position.distance_to(target) > 0.05)
                  set_tgt(a, target, pd.yaw)
                  a.get_node("Lamp").visible = pd.light
                  a.visible = not bool(pd.get("hid", false))
                  a.rotation.x = -1.4 if bool(pd.get("down", false)) else 0.0
              for id in avatars.keys():
                  if not peers.has(id):
                      avatars[id].queue_free()
                      avatars.erase(id)

          # ---------- voice chat (push to talk, mic -> 12 kHz mono over RPC) ----------
          func setup_voice() -> void:
              OS.request_permissions()
              var idx := AudioServer.bus_count
              AudioServer.add_bus(idx)
              AudioServer.set_bus_name(idx, "Mic")
              capture = AudioEffectCapture.new()
              AudioServer.add_bus_effect(idx, capture)
              AudioServer.set_bus_mute(idx, true)
              mic_player = AudioStreamPlayer.new()
              mic_player.stream = AudioStreamMicrophone.new()
              mic_player.bus = "Mic"
              add_child(mic_player)
              mic_player.play()
              voice_ok = true

          func toggle_voice() -> void:
              if not online():
                  status("Sesli sohbet sadece online oyunda")
                  return
              if not voice_ok:
                  setup_voice()
              talking = not talking
              action_buttons[8].text = "KONUŞ: AÇIK" if talking else "KONUŞ"
              status("Mikrofon açık" if talking else "Mikrofon kapalı")

          func voice_tick() -> void:
              if not voice_ok or not talking or not online():
                  return
              var frames := capture.get_frames_available()
              if frames < 600:
                  return
              var buf := capture.get_buffer(frames)
              var ratio := maxi(1, int(AudioServer.get_mix_rate() / VRATE))
              var count := buf.size() / ratio
              var out := PackedByteArray()
              out.resize(count * 2)
              for i in range(count):
                  out.encode_s16(i * 2, int(clampf(buf[i * ratio].x, -1.0, 1.0) * 30000.0))
              if multiplayer.is_server():
                  relay_voice.rpc(1, out)
              else:
                  send_voice.rpc(out)

          @rpc("any_peer", "call_remote", "unreliable")
          func send_voice(data: PackedByteArray) -> void:
              if not multiplayer.is_server():
                  return
              var sid := multiplayer.get_remote_sender_id()
              for id in multiplayer.get_peers():
                  if id != sid:
                      relay_voice.rpc_id(id, sid, data)
              play_voice(sid, data)

          @rpc("authority", "call_remote", "unreliable")
          func relay_voice(sid: int, data: PackedByteArray) -> void:
              play_voice(sid, data)

          func play_voice(sid: int, data: PackedByteArray) -> void:
              if not voice_pb.has(sid):
                  var p := AudioStreamPlayer.new()
                  var g := AudioStreamGenerator.new()
                  g.mix_rate = VRATE
                  g.buffer_length = 0.4
                  p.stream = g
                  add_child(p)
                  p.play()
                  voice_pb[sid] = p.get_stream_playback()
                  voice_nodes[sid] = p
              var pb: AudioStreamGeneratorPlayback = voice_pb[sid]
              var n := data.size() / 2
              var arr := PackedVector2Array()
              arr.resize(n)
              for i in range(n):
                  var v := data.decode_s16(i * 2) / 32768.0
                  arr[i] = Vector2(v, v)
              if pb.get_frames_available() >= n:
                  pb.push_buffer(arr)

          # ---------- replay: last 60 s, top-down or first person, can be saved ----------
          func record_tick(delta: float) -> void:
              if replaying:
                  return
              rec_timer -= delta
              if rec_timer > 0:
                  return
              rec_timer = 0.1
              var dots: Array = [[player.position, Color(0.2, 0.6, 1.0)]]
              for id in avatars:
                  dots.append([avatars[id].position, Color(0.2, 1.0, 1.0)])
              for c in customers:
                  dots.append([c.node.position, Color(0.2, 0.9, 0.2)])
              for i in range(items.size()):
                  if item_state[i] != -1:
                      dots.append([items[i].position, Color(0.8, 0.55, 0.2)])
              if monster.visible:
                  dots.append([monster.position, Color(1.0, 0.05, 0.05)])
              record.append({"d": dots, "p": player.position, "y": yaw, "t": pitch})
              if record.size() > 600:
                  record.pop_front()

          func toggle_replay() -> void:
              if replaying:
                  if not replay_fp:
                      replay_fp = true
                      replay_cam.projection = Camera3D.PROJECTION_PERSPECTIVE
                      replay_cam.fov = 75
                      status("REPLAY 1. şahıs. Çıkmak için tekrar REPLAY")
                  else:
                      stop_replay()
                  return
              if record.size() < 20:
                  status("Henüz yeterli kayıt yok")
                  return
              close_panels()
              replaying = true
              replay_fp = false
              replay_index = 0.0
              replay_root = Node3D.new()
              add_child(replay_root)
              replay_cam = Camera3D.new()
              replay_cam.projection = Camera3D.PROJECTION_ORTHOGONAL
              replay_cam.size = 28
              replay_cam.position = Vector3(0, 7.4, 0)
              replay_cam.rotation.x = -PI / 2
              replay_root.add_child(replay_cam)
              replay_cam.current = true
              status("REPLAY üstten. 1. şahıs için tekrar REPLAY")

          func play_replay(delta: float) -> void:
              replay_index += delta * 10.0
              if replay_index >= record.size():
                  stop_replay()
                  return
              var f: Dictionary = record[int(replay_index)]
              for child in replay_root.get_children():
                  if child != replay_cam:
                      child.queue_free()
              var h := 0.9 if replay_fp else 3.0
              for d in f.d:
                  var m := mesh_box(replay_root, Vector3(d[0].x, h, d[0].z), Vector3(0.6, 0.2, 0.6), d[1])
                  var material: StandardMaterial3D = m.material_override
                  material.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
              if replay_fp:
                  replay_cam.position = f.p + Vector3(0, 1.55, 0)
                  replay_cam.rotation = Vector3(f.t, f.y, 0)

          func stop_replay() -> void:
              replaying = false
              cam.current = true
              replay_root.queue_free()
              status("Oyuna dönüldü")

          func save_replay() -> void:
              if record.size() < 20:
                  status("Henüz yeterli kayıt yok")
                  return
              var path := "user://replay_%d.dat" % int(Time.get_unix_time_from_system())
              var f := FileAccess.open(path, FileAccess.WRITE)
              if f:
                  f.store_string(var_to_str(record))
                  f.close()
                  status("Replay kaydedildi: " + ProjectSettings.globalize_path(path))
              else:
                  status("Replay kaydedilemedi")
          SCRIPT
      - name: Generate sounds (procedural WAV; your own assets/audio files win)
        run: |
          set -eux
          cd game
          python3 - <<'PY'
          import math, random, struct, wave, os
          R = 22050
          random.seed(7)
          def N(sec): return int(R * sec)
          def save(name, xs):
              for ext in ('ogg', 'wav', 'mp3'):
                  if os.path.exists('assets/audio/%s.%s' % (name, ext)):
                      return
              os.makedirs('assets/audio', exist_ok=True)
              w = wave.open('assets/audio/%s.wav' % name, 'wb')
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(R)
              w.writeframes(b''.join(struct.pack('<h', int(max(-1.0, min(1.0, v)) * 30000)) for v in xs))
              w.close()
          def noise(n): return [random.uniform(-1, 1) for _ in range(n)]
          def lp(xs, a):
              out = []; p = 0.0
              for v in xs:
                  p += a * (v - p); out.append(p)
              return out
          def hp(xs, a): return [v - l for v, l in zip(xs, lp(xs, a))]
          def sweep(n, f0, f1):
              out = []; ph = 0.0
              for i in range(n):
                  ph += 2 * math.pi * (f0 + (f1 - f0) * i / n) / R
                  out.append(math.sin(ph))
              return out
          def decay(xs, k): return [v * math.exp(-k * i / R) for i, v in enumerate(xs)]
          def gain(xs, g): return [v * g for v in xs]
          def mix(*ls):
              n = max(len(l) for l in ls)
              return [sum(l[i] if i < len(l) else 0.0 for l in ls) for i in range(n)]
          def fade(xs, ms=15):
              out = list(xs); n = min(int(R * ms / 1000), len(out) // 2)
              for i in range(n):
                  out[i] *= i / n; out[-1 - i] *= i / n
              return out
          def ping(f): return decay(sweep(N(0.5), f, f), 9)
          save('step', fade(gain(decay(lp(noise(N(0.14)), 0.12), 28), 3.2)))
          save('mstep', fade(mix(gain(decay(sweep(N(0.25), 70, 40), 14), 0.9), gain(decay(lp(noise(N(0.25)), 0.08), 16), 3.0))))
          save('stock', fade(mix(gain(decay(sweep(N(0.25), 110, 60), 16), 0.8), gain(decay(lp(noise(N(0.25)), 0.2), 10), 1.8))))
          save('cash', fade(mix(gain(ping(1568), 0.5), gain([0.0] * N(0.09) + ping(2093), 0.5))))
          n = N(1.3)
          dist = [math.tanh(3 * v) for v in sweep(n, 1100, 90)]
          save('scare', fade(decay(mix(gain(dist, 0.6), gain(hp(noise(n), 0.3), 0.5)), 2.5), 30))
          n = N(6.0)
          hum = mix(gain(sweep(n, 50, 50), 0.35), gain(sweep(n, 100, 100), 0.15), gain(sweep(n, 150.5, 150.5), 0.06))
          wind = [w * (0.6 + 0.4 * math.sin(2 * math.pi * 0.3 * i / R)) * 6.0 for i, w in enumerate(lp(noise(n), 0.01))]
          save('ambient', fade(mix(gain(hum, 0.5), wind), 300))
          n = N(1.0); ph = 0.0; creak = []
          for i in range(n):
              t = i / R
              ph += 2 * math.pi * (180 + 60 * math.sin(2 * math.pi * 3 * t) + 100 * t) / R
              creak.append(((ph / (2 * math.pi)) % 1.0) * 2 - 1)
          save('door', fade([v * math.sin(math.pi * i / n) * 0.6 for i, v in enumerate(lp(creak, 0.2))], 20))
          n = N(0.9)
          save('crash', fade(mix(gain(decay(noise(n), 6), 0.8), gain(decay(sweep(n, 90, 45), 7), 0.8))))
          n = N(0.5)
          save('phone', fade([(0.5 + 0.5 * math.sin(2 * math.pi * 20 * i / R)) * (math.sin(2 * math.pi * 440 * i / R) + math.sin(2 * math.pi * 480 * i / R)) * 0.4 for i in range(n)]))
          n = N(0.45)
          save('scratch', fade([v * (1.0 if (i * 25 / R) % 1.0 < 0.35 else 0.15) * 0.8 for i, v in enumerate(hp(noise(n), 0.25))]))
          n = N(1.4); x = noise(n)
          bp = [a - b for a, b in zip(lp(x, 0.45), lp(x, 0.08))]
          save('whisper', fade([v * (max(0.0, math.sin(2 * math.pi * 2.2 * i / R)) ** 2) * 2.0 for i, v in enumerate(bp)], 30))
          n = N(0.7)
          thump = lambda f0, f1, k: decay(sweep(N(0.3), f0, f1), k)
          save('heart', fade(mix(gain(thump(62, 38, 22), 1.0), gain([0.0] * N(0.27) + thump(54, 34, 26), 0.75), gain(decay(lp(noise(n), 0.05), 30), 0.4))))
          n = N(1.2)
          base = sweep(n, 78, 52)
          am = [0.55 + 0.45 * math.sin(2 * math.pi * 26 * i / R) for i in range(n)]
          grr = [math.tanh(2.5 * b * a) for b, a in zip(base, am)]
          env = [math.sin(math.pi * i / n) ** 0.6 for i in range(n)]
          save('growl', fade([(g * 0.7 + v * 0.35) * e for g, v, e in zip(grr, lp(noise(n), 0.15), env)], 40))
          n = N(0.4)
          save('thud', fade(mix(gain(decay(sweep(n, 95, 35), 16), 1.0), gain(decay(lp(noise(n), 0.1), 24), 1.6))))
          PY
      - name: Import project and validate scripts
        run: |
          set -euxo pipefail
          GODOT="$(pwd)/godot-bin/Godot_v4.4.1-stable_linux.x86_64"
          "$GODOT" --headless --path game --import 2>&1 | tee import.log
          "$GODOT" --headless --path game --quit-after 120 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error" import.log run.log; then exit 1; fi
      - name: Export Android APK
        run: |
          set -euxo pipefail
          GODOT="$(pwd)/godot-bin/Godot_v4.4.1-stable_linux.x86_64"
          APK="$GITHUB_WORKSPACE/output/KAOS_MARKET_NIGHT_SHIFT.apk"
          "$GODOT" --headless --path game --export-debug Android "$APK"
          test -s "$APK"
          ls -lh "$APK"
      - name: Release AAB (signed, optional)
        continue-on-error: true
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euxo pipefail
          G=4.4.1
          GODOT="$(pwd)/godot-bin/Godot_v${G}-stable_linux.x86_64"
          mkdir -p game/android/build
          unzip -q -o "$HOME/.local/share/godot/export_templates/${G}.stable/android_source.zip" -d game/android/build
          echo "${G}.stable" > game/android/.build_version
          touch game/android/build/.gdignore
          chmod +x game/android/build/gradlew
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KS_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KS_PASS"
          else
            keytool -genkeypair -alias kaosrelease -keyalg RSA -keysize 2048 -validity 10000 -keystore "$RUNNER_TEMP/release.keystore" -storepass kaos-temp-pass -keypass kaos-temp-pass -dname "CN=Kaos Market,O=Kaos,C=TR"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="kaosrelease"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="kaos-temp-pass"
          fi
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          "$GODOT" --headless --path game --export-release "Android AAB" "$GITHUB_WORKSPACE/output/KAOS_MARKET_NIGHT_SHIFT.aab"
          test -s "$GITHUB_WORKSPACE/output/KAOS_MARKET_NIGHT_SHIFT.aab"
      - name: Create feature status report
        run: |
          cat > output/FEATURE_STATUS.txt <<'REPORT'
          EKLENDI (cihazda test edilmedi, CI sadece derleme/script dogrulamasi yapar):
          - Kayit sistemi (para, yukseltme, gece, basarim, notlar, ayarlar)
          - Gece dongusu 23:00-06:00, ozet ekrani, zorlasan geceler, 5. gecede son
          - Ayarlar (ses, kamera hassasiyeti, grafik), ana menu, Game Over
          - Gorevler: leke silme, cop atma, son kullanma tarihi, elektrik kesintisi + sigorta, telefon
          - Saklanma (dolap, kasa alti), fener pili, kosma dayanikliligi, guvenlik kameralari
          - 03:00 kural musterisi, 3 yaratik turu, yonlu 3D sesler, rastgele olaylar
          - Hikaye notlari, 3 son, kiyafetler, basarimlar
          - Multiplayer: yerel ag + UPnP ile internet, hareket yumusatma, sunucu tarafli hile korumasi,
            dusen arkadasi kaldirma, itme-konus sesli sohbet
          - Replay: ustten + birinci sahis, dosyaya kaydetme (user:// klasoru)
          - Musteri AI: yol bulma + kacma; AAB (secrets yoksa gecici anahtarla), ikon

          KALANLAR (kod ile cozulemez, varlik/sunucu gerekir):
          1. Fotogercekci modeller kodla yapilamaz; kapsul/kure insan + yaratik modelleri otomatik uretilir, istersen assets/models/*.glb ile degistir
          2. Sesler CI'da uretilir (assets/audio/*.wav); kendi .ogg/.wav dosyan varsa o kullanilir
          3. Ragdoll artik eklemli (kapsul kemikler, hinge/cone-twist); gercek skeleton modeli degil
          4. Gercek relay/lobi sunucusu (su an dogrudan IP + UPnP), birebir ragdoll senkronu
          5. Replay'i uygulama disina paylasma (Android share eklentisi gerekir)
          6. Gercek cihaz testi ve Play Store icin kalici anahtar:
             KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS secret'larini ekle
          REPORT

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KAOS-MARKET-NIGHT-SHIFT
          path: |
            output/KAOS_MARKET_NIGHT_SHIFT.apk
            output/KAOS_MARKET_NIGHT_SHIFT.aab
            output/FEATURE_STATUS.txt
          if-no-files-found: warn
          retention-days: 14

  report:
    needs: android
    if: always() && needs.android.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish failure log to ci-logs branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          REPO="${{ github.repository }}"
          JOB_ID=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.name=="android") | .id')
          gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > full.log || true
          {
            echo "run: ${{ github.run_id }}"
            grep -n -E "##\[error\]|SCRIPT ERROR|Parse Error|ERROR:|Error:|error:|FAILED|xit code" full.log | tail -n 60 || true
            echo "----- LAST 80 LINES -----"
            tail -n 80 full.log
          } | sed 's/\x1b\[[0-9;]*m//g' > ci-log.txt
          git init -q
          git checkout -q -b ci-logs
          git config user.name github-actions
          git config user.email actions@github.com
          git add ci-log.txt
          git commit -q -m "ci log ${{ github.run_id }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/$REPO.git" ci-logs
