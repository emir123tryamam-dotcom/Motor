          # ---------- audio: real files in assets/audio override the synth ----------
          func build_audio() -> void:
              for entry in [["step", 95.0, 0.10], ["scare", 38.0, 0.9], ["cash", 880.0, 0.15], ["stock", 220.0, 0.2], ["ambient", 55.0, 2.0], ["door", 140.0, 0.35], ["crash", 70.0, 0.6], ["phone", 760.0, 0.5], ["mstep", 75.0, 0.12], ["scratch", 1800.0, 0.15], ["whisper", 320.0, 1.0], ["heart", 55.0, 0.6], ["growl", 70.0, 1.0], ["thud", 60.0, 0.3]]:
                  var key: String = entry[0]
                  var stream: AudioStream = null
                  for ext in ["ogg", "wav", "mp3"]:
                      var path := "res://assets/audio/%s.%s" % [key, ext]
                      if ResourceLoader.exists(path):
                          stream = load(path)
                          break
                  streams[key] = stream if stream else tone(entry[1], entry[2])
                  if ["step", "scare", "cash", "stock", "ambient", "heart"].has(key):
                      var p := AudioStreamPlayer.new()
                      p.volume_db = -20.0 if key == "ambient" else (-9.0 if key == "heart" else -7.0)
                      p.stream = streams[key]
                      add_child(p)
                      sounds[key] = p
              sounds["ambient"].finished.connect(func(): sounds["ambient"].play())
              sounds["ambient"].play()

          func tone(freq: float, duration: float) -> AudioStreamWAV:
              var rate := 22050
              var count := int(rate * duration)
              var bytes := PackedByteArray()
              bytes.resize(count * 2)
              for i in range(count):
                  var t := float(i) / rate
                  var fade: float = min(1.0, min(t, duration - t) * 30.0)
                  bytes.encode_s16(i * 2, int((sin(t * TAU * freq) * 0.18 + sin(t * TAU * freq * 0.5) * 0.06) * fade * 32767.0))
              var wav := AudioStreamWAV.new()
              wav.format = AudioStreamWAV.FORMAT_16_BITS
              wav.mix_rate = rate
              wav.data = bytes
              return wav

          # directional 3D sound at a world position
          func play3d(key: String, pos: Vector3) -> void:
              if not streams.has(key):
                  return
              var p := AudioStreamPlayer3D.new()
              p.stream = streams[key]
              p.position = pos
              p.unit_size = 4.0
              p.max_distance = 35.0
              p.volume_db = 3.0
              add_child(p)
              p.finished.connect(p.queue_free)
              p.play()

          func emit_snd(key: String, pos: Vector3) -> void:
              fx("snd:" + key, pos)
              if online():
                  fx.rpc("snd:" + key, pos)

